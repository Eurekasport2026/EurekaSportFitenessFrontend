<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none">
  
  <defs>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#0066ff" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="320" height="240" rx="12" fill="#f8fafc" />
  <!-- Lower Legs Posterior Silhouette (Knees to Ankles) -->
  <path d="M 85 30 L 135 30 Q 140 60 135 105 Q 130 160 125 210 L 95 210 Q 90 160 85 105 Q 80 60 85 30 Z" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2" />
  <path d="M 185 30 L 235 30 Q 240 60 235 105 Q 230 160 225 210 L 195 210 Q 190 160 185 105 Q 180 60 185 30 Z" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2" />
  <!-- Popliteal Fossa (Back of Knees) -->
  <path d="M 92 40 Q 110 45 128 40 M 192 40 Q 210 45 228 40" stroke="#94a3b8" stroke-width="2" fill="none" />
  <!-- Left Gastrocnemius (Lateral & Medial Heads) -->
  <path d="M 90 48 Q 72 80 78 115 Q 85 138 98 148 L 102 75 Z" fill="url(#blueGlow)" filter="url(#glow)" opacity="0.95" />
  <path d="M 130 48 Q 145 80 140 120 Q 132 142 120 150 L 118 75 Z" fill="url(#blueGlow)" filter="url(#glow)" opacity="0.95" />
  <!-- Left Soleus & Achilles -->
  <path d="M 98 145 Q 102 175 104 205 L 116 205 Q 118 175 120 145 Z" fill="#0284c7" opacity="0.8" />
  <path d="M 108 145 L 108 208" stroke="#ffffff" stroke-width="1.5" opacity="0.6" stroke-linecap="round" />
  <!-- Right Gastrocnemius (Lateral & Medial Heads) -->
  <path d="M 190 48 Q 175 80 180 120 Q 188 142 200 150 L 202 75 Z" fill="url(#blueGlow)" filter="url(#glow)" opacity="0.95" />
  <path d="M 230 48 Q 248 80 242 115 Q 235 138 222 148 L 218 75 Z" fill="url(#blueGlow)" filter="url(#glow)" opacity="0.95" />
  <!-- Right Soleus & Achilles -->
  <path d="M 198 145 Q 202 175 204 205 L 216 205 Q 218 175 220 145 Z" fill="#0284c7" opacity="0.8" />
  <path d="M 208 145 L 208 208" stroke="#ffffff" stroke-width="1.5" opacity="0.6" stroke-linecap="round" />
  <text x="160" y="222" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0369a1" letter-spacing="1">GASTROCNEMIUS &amp; SOLEUS</text>
</svg>