<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none">
  
  <defs>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#0066ff" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="320" height="240" rx="12" fill="#f8fafc" />
  <!-- Flexed Arm Silhouette -->
  <!-- Shoulder, Upper Arm, Forearm, Fist -->
  <path d="M 60 170 Q 70 110 95 85 Q 120 70 145 75 L 175 60 Q 205 50 230 70 Q 255 95 240 135 L 210 165 Q 185 190 155 190 L 115 185 Q 85 185 60 170 Z" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2" />
  <!-- Forearm & Hand contour -->
  <path d="M 230 70 L 250 85 Q 265 100 255 125 L 235 150 Q 215 175 195 180" stroke="#cbd5e1" stroke-width="2" fill="none" />
  <!-- Biceps Brachii (Peak Muscle Highlight) -->
  <path d="M 115 90 Q 145 68 178 78 Q 200 88 195 118 Q 170 138 135 132 Q 115 125 115 90 Z" fill="url(#blueGlow)" filter="url(#glow)" opacity="0.95" />
  <!-- Muscle Striations & Separation -->
  <path d="M 125 98 Q 155 85 185 96" stroke="#ffffff" stroke-width="2" opacity="0.7" stroke-linecap="round" />
  <path d="M 130 112 Q 155 105 180 112" stroke="#ffffff" stroke-width="1.5" opacity="0.6" stroke-linecap="round" />
  <!-- Brachialis & Brachioradialis -->
  <path d="M 175 118 Q 195 125 210 145 L 195 158 Q 175 140 165 130 Z" fill="#0284c7" opacity="0.85" />
  <text x="160" y="218" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0369a1" letter-spacing="1">BICEPS BRACHII &amp; ELBOW FLEXORS</text>
</svg>