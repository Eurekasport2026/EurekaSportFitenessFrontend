<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none">
  
  <defs>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#0066ff" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="320" height="240" rx="12" fill="#f8fafc" />
  <!-- Body Silhouette (Back Torso) -->
  <path d="M 160 25 Q 140 28 125 40 Q 105 48 75 62 L 62 110 Q 75 145 88 180 L 105 230 L 215 230 L 232 180 Q 245 145 258 110 L 245 62 Q 215 48 195 40 Q 180 28 160 25 Z" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2" />
  <!-- Spine Line -->
  <path d="M 160 35 L 160 210" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3 3" />
  <!-- Trapezius (Upper Back Diamond) -->
  <path d="M 160 38 L 190 62 L 180 102 L 160 120 L 140 102 L 130 62 Z" fill="url(#blueGlow)" filter="url(#glow)" opacity="0.9" />
  <!-- Latissimus Dorsi (Left & Right Wings) -->
  <path d="M 140 105 Q 105 105 82 120 Q 86 160 115 185 Q 140 188 156 182 L 156 122 Q 148 112 140 105 Z" fill="url(#blueGlow)" filter="url(#glow)" opacity="0.95" />
  <path d="M 180 105 Q 215 105 238 120 Q 234 160 205 185 Q 180 188 164 182 L 164 122 Q 172 112 180 105 Z" fill="url(#blueGlow)" filter="url(#glow)" opacity="0.95" />
  <!-- Muscle Striations -->
  <path d="M 152 130 Q 120 135 96 142 M 152 145 Q 125 150 105 160 M 152 160 Q 130 165 118 175" stroke="#ffffff" stroke-width="1.5" opacity="0.6" stroke-linecap="round" />
  <path d="M 168 130 Q 200 135 224 142 M 168 145 Q 195 150 215 160 M 168 160 Q 190 165 202 175" stroke="#ffffff" stroke-width="1.5" opacity="0.6" stroke-linecap="round" />
  <!-- Lower Back (Erector Spinae) -->
  <path d="M 148 185 Q 146 205 144 220 L 156 220 L 156 185 Z" fill="#0066ff" opacity="0.75" />
  <path d="M 172 185 Q 174 205 176 220 L 164 220 L 164 185 Z" fill="#0066ff" opacity="0.75" />
  <text x="160" y="218" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0369a1" letter-spacing="1">LATS • TRAPS • RHOMBOIDS</text>
</svg>