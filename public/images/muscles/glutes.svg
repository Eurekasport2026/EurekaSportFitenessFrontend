<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none">
  
  <defs>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#0066ff" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="320" height="240" rx="12" fill="#f8fafc" />
  <!-- Posterior Pelvis & Upper Thighs Silhouette -->
  <path d="M 115 35 Q 160 40 205 35 L 225 65 Q 245 105 235 155 Q 220 185 205 210 L 180 210 Q 172 170 160 140 Q 148 170 140 210 L 115 210 Q 100 185 85 155 Q 75 105 95 65 Z" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2" />
  <!-- Spine base / sacrum -->
  <path d="M 160 35 L 160 85" stroke="#94a3b8" stroke-width="2" stroke-dasharray="2 2" />
  <!-- Gluteus Medius (Upper Lateral Pelvis) -->
  <path d="M 115 50 Q 140 52 152 70 L 140 95 Q 115 88 100 70 Z" fill="#0284c7" opacity="0.85" />
  <path d="M 205 50 Q 180 52 168 70 L 180 95 Q 205 88 220 70 Z" fill="#0284c7" opacity="0.85" />
  <!-- Gluteus Maximus (Left) -->
  <path d="M 156 75 Q 120 72 98 95 Q 85 130 102 165 Q 128 178 152 162 Q 158 135 156 75 Z" fill="url(#blueGlow)" filter="url(#glow)" opacity="0.95" />
  <path d="M 148 85 Q 120 85 108 105" stroke="#ffffff" stroke-width="1.5" opacity="0.6" stroke-linecap="round" />
  <path d="M 148 105 Q 125 108 112 125" stroke="#ffffff" stroke-width="1.5" opacity="0.6" stroke-linecap="round" />
  <path d="M 145 125 Q 128 132 120 145" stroke="#ffffff" stroke-width="1.5" opacity="0.5" stroke-linecap="round" />
  <!-- Gluteus Maximus (Right) -->
  <path d="M 164 75 Q 200 72 222 95 Q 235 130 218 165 Q 192 178 168 162 Q 162 135 164 75 Z" fill="url(#blueGlow)" filter="url(#glow)" opacity="0.95" />
  <path d="M 172 85 Q 200 85 212 105" stroke="#ffffff" stroke-width="1.5" opacity="0.6" stroke-linecap="round" />
  <path d="M 172 105 Q 195 108 208 125" stroke="#ffffff" stroke-width="1.5" opacity="0.6" stroke-linecap="round" />
  <path d="M 175 125 Q 192 132 200 145" stroke="#ffffff" stroke-width="1.5" opacity="0.5" stroke-linecap="round" />
  <!-- Gluteal Cleft & Underfold -->
  <path d="M 160 85 L 160 170" stroke="#cbd5e1" stroke-width="2" />
  <path d="M 105 165 Q 130 178 156 168 M 215 165 Q 190 178 164 168" stroke="#94a3b8" stroke-width="2" fill="none" />
  <text x="160" y="222" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0369a1" letter-spacing="1">GLUTEUS MAXIMUS &amp; MEDIUS</text>
</svg>