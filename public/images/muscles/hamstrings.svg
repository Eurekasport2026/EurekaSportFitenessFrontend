<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none">
  
  <defs>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#0066ff" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="320" height="240" rx="12" fill="#f8fafc" />
  <!-- Posterior Thighs & Glutes Silhouette -->
  <path d="M 95 30 L 225 30 Q 245 60 240 105 Q 235 150 225 185 L 212 210 L 190 210 Q 182 180 175 145 L 160 85 L 145 145 Q 138 180 130 210 L 108 210 L 95 185 Q 85 150 80 105 Q 75 60 95 30 Z" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2" />
  <!-- Gluteal fold line -->
  <path d="M 95 55 Q 125 75 160 75 Q 195 75 225 55" stroke="#94a3b8" stroke-width="2" fill="none" />
  <!-- Left Hamstrings (Biceps Femoris & Semitendinosus) -->
  <path d="M 105 78 Q 92 115 98 155 Q 105 180 114 195 L 126 195 Q 130 165 130 130 Q 128 95 118 78 Z" fill="url(#blueGlow)" filter="url(#glow)" opacity="0.95" />
  <path d="M 125 80 Q 135 110 138 145 Q 135 175 128 195 L 134 195 Q 145 165 142 125 Q 138 95 130 80 Z" fill="#0066ff" opacity="0.9" />
  <!-- Striations -->
  <path d="M 112 100 L 112 165 M 120 95 L 120 175" stroke="#ffffff" stroke-width="1.5" opacity="0.6" stroke-linecap="round" />
  <!-- Right Hamstrings (Biceps Femoris & Semitendinosus) -->
  <path d="M 215 78 Q 228 115 222 155 Q 215 180 206 195 L 194 195 Q 190 165 190 130 Q 192 95 202 78 Z" fill="url(#blueGlow)" filter="url(#glow)" opacity="0.95" />
  <path d="M 195 80 Q 185 110 182 145 Q 185 175 192 195 L 186 195 Q 175 165 178 125 Q 182 95 190 80 Z" fill="#0066ff" opacity="0.9" />
  <!-- Striations -->
  <path d="M 208 100 L 208 165 M 200 95 L 200 175" stroke="#ffffff" stroke-width="1.5" opacity="0.6" stroke-linecap="round" />
  <text x="160" y="222" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0369a1" letter-spacing="1">BICEPS FEMORIS • SEMITENDINOSUS</text>
</svg>