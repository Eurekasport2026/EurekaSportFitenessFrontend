  <rect x="82" y="185" width="24" height="20" rx="5" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5" />
  <rect x="214" y="185" width="24" height="20" rx="5" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5" />
  <!-- Left Forearm: Brachioradialis & Flexors/Extensors Highlighted -->
  <path d="M 82 45 Q 105 55 108 90 Q 106 130 96 175 L 88 175 Q 78 135 76 95 Q 75 65 82 45 Z" fill="url(#blueGlow)" filter="url(#glow)" opacity="0.95" />
  <path d="M 94 60 L 92 155" stroke="#ffffff" stroke-width="1.5" opacity="0.6" stroke-linecap="round" />
  <path d="M 86 70 L 84 140" stroke="#ffffff" stroke-width="1.5" opacity="0.6" stroke-linecap="round" />
  <path d="M 102 70 L 98 140" stroke="#ffffff" stroke-width="1.5" opacity="0.6" stroke-linecap="round" />
  <!-- Right Forearm: Brachioradialis & Flexors/Extensors Highlighted -->
  <path d="M 238 45 Q 215 55 212 90 Q 214 130 224 175 L 232 175 Q 242 135 244 95 Q 245 65 238 45 Z" fill="url(#blueGlow)" filter="url(#glow)" opacity="0.95" />
  <path d="M 226 60 L 228 155" stroke="#ffffff" stroke-width="1.5" opacity="0.6" stroke-linecap="round" />
  <path d="M 234 70 L 236 140" stroke="#ffffff" stroke-width="1.5" opacity="0.6" stroke-linecap="round" />
  <path d="M 218 70 L 222 140" stroke="#ffffff" stroke-width="1.5" opacity="0.6" stroke-linecap="round" />
  <text x="160" y="222" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0369a1" letter-spacing="1">BRACHIORADIALIS • FLEXORS &amp; GRIP</text>
