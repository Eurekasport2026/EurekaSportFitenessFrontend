<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none">
  
  <defs>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#0066ff" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="320" height="240" rx="12" fill="#f8fafc" />
  <!-- Full Body Athletic Silhouette -->
  <!-- Head & Neck -->
  <circle cx="160" cy="30" r="14" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5" />
  <!-- Torso & Arms -->
  <path d="M 160 46 L 140 50 L 115 65 L 102 105 L 115 110 L 126 80 L 132 125 L 135 155 L 142 155 L 138 195 L 148 195 L 155 160 L 160 160 L 165 160 L 172 195 L 182 195 L 178 155 L 185 155 L 188 125 L 194 80 L 205 110 L 218 105 L 205 65 L 180 50 Z" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5" />
  <!-- Illuminated Kinetic Chains: Chest, Core, Quads, Shoulders in Kinetic Compound Glow -->
  <!-- Chest -->
  <path d="M 148 60 Q 160 62 172 60 Q 170 76 160 78 Q 150 76 148 60 Z" fill="url(#blueGlow)" filter="url(#glow)" opacity="0.95" />
  <!-- Core / Abs -->
  <rect x="152" y="82" width="16" height="25" rx="3" fill="url(#blueGlow)" filter="url(#glow)" opacity="0.95" />
  <!-- Shoulders -->
  <circle cx="128" cy="62" r="7" fill="url(#blueGlow)" filter="url(#glow)" opacity="0.95" />
  <circle cx="192" cy="62" r="7" fill="url(#blueGlow)" filter="url(#glow)" opacity="0.95" />
  <!-- Quads & Legs -->
  <path d="M 140 128 Q 136 150 142 165 L 150 165 Q 152 145 148 128 Z" fill="url(#blueGlow)" filter="url(#glow)" opacity="0.95" />
  <path d="M 180 128 Q 184 150 178 165 L 170 165 Q 168 145 172 128 Z" fill="url(#blueGlow)" filter="url(#glow)" opacity="0.95" />
  <!-- Kinetic Chain Connection Pulses -->
  <path d="M 128 62 L 148 60 M 192 62 L 172 60 M 160 78 L 160 82 M 160 107 L 145 130 M 160 107 L 175 130" stroke="#38bdf8" stroke-width="2" stroke-dasharray="2 2" />
  <text x="160" y="222" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0369a1" letter-spacing="1">MULTI-JOINT COMPOUND KINETIC CHAINS</text>
</svg>