<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none">
  
  <defs>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#0066ff" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="320" height="240" rx="12" fill="#f8fafc" />
  <!-- Pelvis & Lower Body Silhouette (Anterior View) -->
  <path d="M 95 30 L 225 30 L 235 60 Q 245 105 240 150 Q 230 185 215 210 L 190 210 Q 185 180 178 150 L 160 90 L 142 150 Q 135 180 130 210 L 105 210 Q 90 185 80 150 Q 75 105 85 60 Z" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2" />
  <!-- Knees / Patella -->
  <circle cx="118" cy="205" r="8" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5" />
  <circle cx="202" cy="205" r="8" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5" />
  <!-- Left Quadriceps -->
  <!-- Vastus Lateralis (Outer) -->
  <path d="M 100 55 Q 85 105 92 150 Q 98 175 110 190 L 115 150 Q 115 100 115 65 Z" fill="url(#blueGlow)" filter="url(#glow)" opacity="0.95" />
  <!-- Rectus Femoris (Center) -->
  <path d="M 118 55 Q 120 100 120 145 L 118 190 L 125 190 Q 130 145 130 85 Q 128 65 118 55 Z" fill="url(#blueGlow)" filter="url(#glow)" opacity="0.9" />
  <!-- Vastus Medialis (Teardrop) -->
  <path d="M 125 135 Q 140 150 138 175 Q 135 195 125 198 L 125 145 Z" fill="#0066ff" filter="url(#glow)" opacity="0.95" />
  <!-- Right Quadriceps -->
  <!-- Vastus Lateralis (Outer) -->
  <path d="M 220 55 Q 235 105 228 150 Q 222 175 210 190 L 205 150 Q 205 100 205 65 Z" fill="url(#blueGlow)" filter="url(#glow)" opacity="0.95" />
  <!-- Rectus Femoris (Center) -->
  <path d="M 202 55 Q 200 100 200 145 L 202 190 L 195 190 Q 190 145 190 85 Q 192 65 202 55 Z" fill="url(#blueGlow)" filter="url(#glow)" opacity="0.9" />
  <!-- Vastus Medialis (Teardrop) -->
  <path d="M 195 135 Q 180 150 182 175 Q 185 195 195 198 L 195 145 Z" fill="#0066ff" filter="url(#glow)" opacity="0.95" />
  <text x="160" y="222" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0369a1" letter-spacing="1">VASTUS LATERALIS • MEDIALIS • RECTUS FEMORIS</text>
</svg>