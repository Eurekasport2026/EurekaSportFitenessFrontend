<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none">
  
  <defs>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#0066ff" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="320" height="240" rx="12" fill="#f8fafc" />
  <!-- Body Silhouette (Torso) -->
  <path d="M 160 30 Q 140 32 125 45 Q 110 50 85 62 L 65 110 Q 75 140 85 170 L 105 230 L 215 230 L 235 170 Q 245 140 255 110 L 235 62 Q 210 50 195 45 Q 180 32 160 30 Z" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2" />
  <!-- Neck & Traps Outline -->
  <path d="M 142 30 L 142 55 M 178 30 L 178 55" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
  <path d="M 160 62 L 160 170" stroke="#94a3b8" stroke-width="2" stroke-dasharray="2 2" />
  <!-- Clavicles -->
  <path d="M 160 56 Q 130 52 95 62 M 160 56 Q 190 52 225 62" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />
  <!-- Chest: Left Pectoral -->
  <path d="M 156 68 Q 115 65 92 85 Q 86 112 95 125 Q 120 138 156 126 Z" fill="url(#blueGlow)" filter="url(#glow)" opacity="0.95" />
  <path d="M 152 76 Q 120 74 102 90" stroke="#ffffff" stroke-width="1.5" opacity="0.6" stroke-linecap="round" />
  <path d="M 152 92 Q 125 90 106 106" stroke="#ffffff" stroke-width="1.5" opacity="0.6" stroke-linecap="round" />
  <path d="M 152 108 Q 130 110 112 118" stroke="#ffffff" stroke-width="1.5" opacity="0.5" stroke-linecap="round" />
  <!-- Chest: Right Pectoral -->
  <path d="M 164 68 Q 205 65 228 85 Q 234 112 225 125 Q 200 138 164 126 Z" fill="url(#blueGlow)" filter="url(#glow)" opacity="0.95" />
  <path d="M 168 76 Q 200 74 218 90" stroke="#ffffff" stroke-width="1.5" opacity="0.6" stroke-linecap="round" />
  <path d="M 168 92 Q 195 90 214 106" stroke="#ffffff" stroke-width="1.5" opacity="0.6" stroke-linecap="round" />
  <path d="M 168 108 Q 190 110 208 118" stroke="#ffffff" stroke-width="1.5" opacity="0.5" stroke-linecap="round" />
  <!-- Abdominal & Serratus hints -->
  <path d="M 125 145 Q 140 148 160 148 Q 180 148 195 145" stroke="#cbd5e1" stroke-width="2" fill="none" />
  <path d="M 130 175 Q 145 178 160 178 Q 175 178 190 175" stroke="#cbd5e1" stroke-width="2" fill="none" />
  <path d="M 82 128 L 88 135 M 80 142 L 86 148 M 238 128 L 232 135 M 240 142 L 234 148" stroke="#0066ff" stroke-width="2" opacity="0.7" stroke-linecap="round" />
  <text x="160" y="218" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0369a1" letter-spacing="1">PECTORALIS MAJOR &amp; MINOR</text>
</svg>