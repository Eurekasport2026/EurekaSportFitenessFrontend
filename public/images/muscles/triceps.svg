<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none">
  
  <defs>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#0066ff" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="320" height="240" rx="12" fill="#f8fafc" />
  <!-- Arm Silhouette (Posterior/Lateral Extension View) -->
  <path d="M 100 40 Q 120 40 140 50 L 165 70 L 175 120 L 180 180 Q 175 200 160 205 L 140 200 L 120 150 L 105 110 Q 95 70 100 40 Z" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2" />
  <!-- Shoulder reference -->
  <path d="M 100 40 Q 120 35 140 45 Q 160 55 165 75 Q 150 85 130 80 Q 110 75 100 40 Z" fill="#cbd5e1" opacity="0.6" />
  <!-- Horseshoe Triceps (Lateral & Long Heads) -->
  <path d="M 128 78 Q 155 82 162 105 Q 168 135 155 160 Q 142 165 135 150 Q 138 128 130 115 Q 120 105 128 78 Z" fill="url(#blueGlow)" filter="url(#glow)" opacity="0.95" />
  <!-- Lateral head -->
  <path d="M 112 85 Q 128 92 128 115 Q 125 135 118 145 L 108 125 Q 104 105 112 85 Z" fill="url(#blueGlow)" filter="url(#glow)" opacity="0.9" />
  <!-- Striations & Tendon -->
  <path d="M 140 92 Q 152 110 152 135" stroke="#ffffff" stroke-width="1.5" opacity="0.6" stroke-linecap="round" />
  <path d="M 148 100 Q 158 118 156 142" stroke="#ffffff" stroke-width="1.5" opacity="0.6" stroke-linecap="round" />
  <!-- Common Triceps Tendon -->
  <path d="M 135 150 L 155 160 L 148 178 L 132 170 Z" fill="#94a3b8" opacity="0.7" />
  <text x="160" y="218" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0369a1" letter-spacing="1">TRICEPS BRACHII (3 HEADS)</text>
</svg>