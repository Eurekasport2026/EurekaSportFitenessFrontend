# Next.js on Netlify — OpenNext runtime via @netlify/plugin-nextjs
# Publish must be ".next" (never "public").

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Locale-prefixed app: send bare "/" to the default locale if middleware
# has not already redirected. Do NOT add a /* → /index.html SPA rule.
[[redirects]]
  from = "/"
  to = "/it"
  status = 302

[context.production.environment]
  NEXT_PUBLIC_USE_MOCK_DATA = "true"
  NEXT_PUBLIC_API_URL = "http://localhost:8000/api/v1"
  NEXT_PUBLIC_MOCK_FALLBACK = "true"
  NEXT_PUBLIC_API_TIMEOUT_MS = "8000"
